name: KidTrack - Deploy Admin Portal to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ─────────────────────────────────────────
  # BUILD ADMIN PORTAL
  # ─────────────────────────────────────────
  build:
    name: 🌐 Build Admin Portal
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install
        run: npm install
        working-directory: admin-portal

      - name: 🔨 Build
        run: npm run build
        working-directory: admin-portal

      - name: ✅ Done
        run: |
          echo "Build complete!"
          ls admin-portal/dist

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      - name: ⬆️ Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-portal/dist

  # ─────────────────────────────────────────
  # DEPLOY TO GITHUB PAGES
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🌐 Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Live
        run: |
          echo "============================================"
          echo "  🎉 KidTrack Admin Portal is LIVE!"
          echo "  🌐 https://nithinshasi.github.io/kidtrack/"
          echo "============================================"
